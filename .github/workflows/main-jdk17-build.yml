name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'

jobs:
  security:
    name: Semgrep Security Gate
    uses: ./.github/workflows/semgrep.yml

  build:
    needs: security
    runs-on: ubuntu-latest

    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      
      
      - name: Build with Maven
        id: maven_build
        run: mvn -pl tika-core -am clean apache-rat:check verify -Pci -B

      - name: Detect failed Maven tests
        id: test_failure
        if: ${{ failure() && steps.maven_build.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          failed = False
          for report in Path(".").rglob("TEST-*.xml"):
              if report.parent.name not in ("surefire-reports", "failsafe-reports"):
                  continue
              try:
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
                  for suite in suites:
                      count = int(suite.get("failures", "0")) + int(suite.get("errors", "0"))
                      if count > 0:
                          failed = True
                          print(f"Failed test report: {report}")
              except (OSError, ET.ParseError, ValueError) as exc:
                  print(f"Could not read {report}: {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"failed={str(failed).lower()}\n")
          PY

      - name: Rickroll on test failure
        if: ${{ failure() && steps.test_failure.outputs.failed == 'true' }}
        uses: ./.github/actions/rickroll


      - name: Show Checkstyle errors
        if: failure()
        run: |
          if [ -f tika-core/target/checkstyle-result.xml ]; then
            grep -n -B 3 -A 1 '<error ' tika-core/target/checkstyle-result.xml || true
          else
            echo "Checkstyle report not found"
          fi

  e2e-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
